# The settings below correspond to the various
# options listed by `stainless --help`

vc-cache            = true
# debug               = ["verification", "smt"]
check-models        = false
print-ids           = false
print-types         = false
batched             = false
strict-arithmetic   = false
solvers             = "smt-cvc5,smt-z3"
check-measures      = yes
infer-measures      = true
simplifier           = "bland"
z3-rlimit           = 500
cvc5-rlimit         = 500
# Rules hold their transformation function, and the lexer compares rules and tokens
function-equality   = "none"
