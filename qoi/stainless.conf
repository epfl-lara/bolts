vc-cache = true
timeout = 1200
strict-arithmetic = false
batched = false
solvers = "smt-cvc4,smt-z3,smt-cvc5"
infer-measures = false
simplifier = "bland"
no-colors = false
# Resource limits in millions of units: 2x the most expensive query over 10 runs (see resource-report.html)
z3-rlimit = 957
cvc5-rlimit = 16
