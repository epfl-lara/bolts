# The settings below correspond to the various
# options listed by `stainless --help`

vc-cache            = true
# debug               = ["smt"]
timeout             = 180
check-models        = false
print-ids           = false
print-types         = false
batched             = true
strict-arithmetic   = true
solvers             = "smt-cvc5,smt-cvc4,smt-z3"
check-measures      = yes
infer-measures      = true
simplifier           = "ol"
no-colors           = false
# Resource limits in millions of units: 2x the most expensive query over 10 runs (see resource-report.html)
z3-rlimit = 935
cvc5-rlimit = 16
